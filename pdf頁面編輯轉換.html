
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>PDF 頁面編輯</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
/* ════════════════════════════════════
   CONVERT MODE
════════════════════════════════════ */
let convFmt='images', convQ='medium', convPgMode='all';

const CONV_NOTES={
  images:'每頁輸出為獨立 PNG 圖片，打包成 ZIP 壓縮檔下載。',
  ppt:   '每頁轉為一張投影片的圖片，版面與原 PDF 完全相同，下載 PPTX 後以 PowerPoint 開啟。',
  word:  '每頁渲染成圖片嵌入 Word 文件，保留原始版面。如需可編輯文字請另行執行 OCR 識別。',
  excel: '擷取每頁的文字內容，每頁產生一個工作表。表格版面與圖片無法保留，僅支援文字內容。'
};
const CONV_Q_SCALE={low:1.5, medium:2.5, high:4.0};

function convInitPanel(){
  const convTo=document.getElementById('convTo');
  if(convTo)convTo.value=totalPages;
  const convFrom=document.getElementById('convFrom');
  if(convFrom)convFrom.max=convFrom.value=1;
  if(convTo)convTo.max=totalPages;
  convUpdateNote();
}
function convSetFmt(f){
  convFmt=f;
  document.querySelectorAll('[data-fmt]').forEach(b=>b.classList.toggle('active',b.dataset.fmt===f));
  document.getElementById('qualGrp').classList.toggle('hidden',f==='excel');
  convUpdateNote();
}
function convSetQ(q){
  convQ=q;
  document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('active',b.dataset.q===q));
}
function convSetPg(m){
  convPgMode=m;
  document.querySelectorAll('[data-pg]').forEach(b=>b.classList.toggle('active',b.dataset.pg===m));
  document.getElementById('convRange').classList.toggle('hidden',m!=='range');
}
function convUpdateNote(){
  const el=document.getElementById('convNote');
  if(el)el.textContent=CONV_NOTES[convFmt]||'';
}
function convSetProgress(pct,lbl){
  const wrap=document.getElementById('convProgWrap'),fill=document.getElementById('convProgFill'),lblEl=document.getElementById('convProgLbl');
  if(wrap)wrap.classList.remove('hidden');
  if(fill)fill.style.width=Math.round(pct*100)+'%';
  if(lblEl)lblEl.textContent=lbl;
}
function convGetPages(){
  if(convPgMode==='all')return[...pageOrder];
  const from=parseInt(document.getElementById('convFrom')?.value)||1;
  const to  =parseInt(document.getElementById('convTo')?.value)||totalPages;
  return pageOrder.filter(p=>p>=from&&p<=to);
}

/* ── Load external libraries lazily ── */
let _convLibs=null;
async function ensureConvLibs(){
  if(_convLibs)return;
  const load=(src,test)=>new Promise((res,rej)=>{
    if(test())return res();
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('無法載入：'+src));
    document.head.appendChild(s);
  });
  await load('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip);
  await load('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX);
  await load('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.min.js',()=>window.PptxGenJS);
  _convLibs=true;
}

/* ── Main entry ── */
async function startConversion(){
  if(busy){showToast('請稍候…');return;}
  const pages=convGetPages();
  if(!pages.length){showModal('⚠️','無頁面','指定範圍內無頁面，請重新設定');return;}
  busy=true;
  document.getElementById('convProgWrap')?.classList.remove('hidden');
  try{
    convSetProgress(0,'載入函式庫…');
    await ensureConvLibs();
    const scale=CONV_Q_SCALE[convQ]||2.5;
    switch(convFmt){
      case 'images': await doConvImages(pages,scale); break;
      case 'ppt':    await doConvPPT(pages,scale);    break;
      case 'word':   await doConvWord(pages,scale);   break;
      case 'excel':  await doConvExcel(pages);        break;
    }
  }catch(e){
    showModal('❌','轉換失敗',e.message||'請重試');
    convSetProgress(0,'');
  }
  busy=false;
}

/* ── Render page to canvas ── */
async function convRenderPage(origPage,scale){
  const page=await pdfJsDoc.getPage(origPage);
  const vp0=page.getViewport({scale:1});
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');
  cv.width=vp.width; cv.height=vp.height;
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  return{canvas:cv,pdfW:vp0.width,pdfH:vp0.height};
}

function blobFromCanvas(cv,type,quality){
  return new Promise(res=>cv.toBlob(res,type,quality));
}

function dlBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}

function convBaseName(){return fileName.replace(/\.pdf$/i,'');}

/* ── PNG Images → ZIP ── */
async function doConvImages(pages,scale){
  const zip=new JSZip();
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`渲染第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas}=await convRenderPage(pages[i],scale);
    const blob=await blobFromCanvas(canvas,'image/png');
    zip.file(`page_${String(i+1).padStart(3,'0')}.png`,blob);
  }
  convSetProgress(.95,'壓縮中…');
  const zipBlob=await zip.generateAsync(
    {type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},
    m=>convSetProgress(.95+m.percent/100*.05,`壓縮 ${Math.round(m.percent)}%…`)
  );
  dlBlob(zipBlob,convBaseName()+'_images.zip');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 張圖片`);
}

/* ── PowerPoint ── */
async function doConvPPT(pages,scale){
  const pptx=new PptxGenJS();
  let wIn=10,hIn=7.5;
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`轉換第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas,pdfW,pdfH}=await convRenderPage(pages[i],scale);
    if(i===0){
      // Set slide size to match PDF aspect
      wIn=10; hIn=Math.round(10*(pdfH/pdfW)*100)/100;
      pptx.defineLayout({name:'PDF',width:wIn,height:hIn});
      pptx.layout='PDF';
    }
    const blob=await blobFromCanvas(canvas,'image/jpeg',.92);
    const b64=await new Promise(res=>{
      const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob);
    });
    const slide=pptx.addSlide();
    slide.addImage({data:'image/jpeg;base64,'+b64,x:0,y:0,w:wIn,h:hIn});
  }
  convSetProgress(.9,'生成 PPTX…');
  const pptxBlob=await pptx.write('blob');
  dlBlob(pptxBlob,convBaseName()+'.pptx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 張投影片`);
}

/* ── Word DOCX (each page as image) ── */
async function doConvWord(pages,scale){
  const zip=new JSZip();
  const MAX_W_EMU=6096000; // ~16.9cm usable width
  let docBody='',relsBody='',firstPdfW=595,firstPdfH=842;
  const imgs=[];

  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`渲染第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas,pdfW,pdfH}=await convRenderPage(pages[i],scale);
    if(i===0){firstPdfW=pdfW;firstPdfH=pdfH;}
    const blob=await blobFromCanvas(canvas,'image/jpeg',.9);
    const rId=`rId${i+1}`;
    const cy=Math.round(MAX_W_EMU*pdfH/pdfW);
    relsBody+=`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/p${i+1}.jpg"/>`;
    docBody+=docxImgPara(rId,i+1,MAX_W_EMU,cy);
    if(i<pages.length-1)docBody+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    imgs.push({name:`p${i+1}.jpg`,blob});
  }

  const pgW=Math.round(firstPdfW*20);   // pt→twips (1pt=20twips)
  const pgH=Math.round(firstPdfH*20);

  zip.file('[Content_Types].xml',docxCT(pages.length));
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml',docxDocument(docBody,pgW,pgH));
  zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+relsBody+'</Relationships>');
  for(const{name,blob}of imgs)zip.file('word/media/'+name,blob);

  convSetProgress(.9,'生成 DOCX…');
  const docxBlob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  dlBlob(docxBlob,convBaseName()+'.docx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 頁`);
}

function docxCT(n){
  let overrides='';
  for(let i=1;i<=n;i++)overrides+=`<Override PartName="/word/media/p${i}.jpg" ContentType="image/jpeg"/>`;
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>${overrides}</Types>`;
}
function docxDocument(body,pgW,pgH){
  const margin=567; // ~1 cm in twips
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="${pgW}" w:h="${pgH}"/><w:pgMar w:top="${margin}" w:right="${margin}" w:bottom="${margin}" w:left="${margin}"/></w:sectPr></w:body></w:document>`;
}
function docxImgPara(rId,idx,cx,cy){
  return`<w:p><w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${idx}" name="p${idx}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${idx}" name="p${idx}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

/* ── Excel XLSX (text extraction) ── */
async function doConvExcel(pages){
  const wb=XLSX.utils.book_new();
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`擷取第 ${pages[i]} 頁文字 (${i+1}/${pages.length})…`);
    const page=await pdfJsDoc.getPage(pages[i]);
    const tc=await page.getTextContent();
    // Sort top-to-bottom, left-to-right
    const sorted=[...tc.items].filter(it=>it.str?.trim()).sort((a,b)=>{
      const dy=b.transform[5]-a.transform[5];
      return Math.abs(dy)>3?dy:a.transform[4]-b.transform[4];
    });
    // Group into lines
    const lines=[]; let curY=null,curLine=[];
    for(const it of sorted){
      const y=Math.round(it.transform[5]);
      if(curY===null||Math.abs(y-curY)>4){
        if(curLine.length)lines.push(curLine.join(' '));
        curLine=[it.str]; curY=y;
      }else curLine.push(it.str);
    }
    if(curLine.length)lines.push(curLine.join(' '));
    const aoa=lines.length?lines.map(l=>[l]):[['（此頁無文字內容）']];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:80}];
    const name=`第${pages[i]}頁`.slice(0,31);
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  convSetProgress(.95,'生成 XLSX…');
  const arr=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  dlBlob(new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),convBaseName()+'.xlsx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 個工作表`);
}


/* ════════════════════════════════════
   MERGE MODE
════════════════════════════════════ */
let mergeFiles=[], _mergeIdSeq=0;

/* Drop zone */
document.getElementById('mergeDrop').addEventListener('dragover',e=>{e.preventDefault();document.getElementById('mergeDrop').classList.add('over');});
document.getElementById('mergeDrop').addEventListener('dragleave',()=>document.getElementById('mergeDrop').classList.remove('over'));
document.getElementById('mergeDrop').addEventListener('drop',e=>{
  e.preventDefault();document.getElementById('mergeDrop').classList.remove('over');
  const files=[...e.dataTransfer.files].filter(f=>f.type==='application/pdf');
  if(files.length)mergeAdd(files);
  else showToast('⚠️ 請選擇 PDF 格式的檔案');
});
document.getElementById('mergeFileInput').addEventListener('change',e=>{mergeAdd([...e.target.files]);e.target.value='';});

async function mergeAdd(files){
  for(const file of files){
    if(file.type!=='application/pdf'){showToast(`⚠️ ${file.name} 不是 PDF 格式`);continue;}
    try{
      const bytes=new Uint8Array(await file.arrayBuffer());
      const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
      const id=++_mergeIdSeq;
      // Render first-page thumbnail (40 px wide)
      let thumb='';
      try{
        const pg=await doc.getPage(1);
        const vp0=pg.getViewport({scale:1});
        const vp=pg.getViewport({scale:40/vp0.width});
        const cv=document.createElement('canvas');
        cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        thumb=cv.toDataURL('image/jpeg',.75);
      }catch(_){}
      mergeFiles.push({id,name:file.name,bytes,pageCount:doc.numPages,thumb});
    }catch(e){showToast(`❌ 無法讀取 ${file.name}`);}
  }
  renderMergeList();
  if(mode==='merge')refreshAbar();
}

function mergeRemove(id){
  mergeFiles=mergeFiles.filter(f=>f.id!==id);
  renderMergeList();refreshAbar();
}

function mergeMove(id,delta){
  const idx=mergeFiles.findIndex(f=>f.id===id);
  if(idx<0)return;
  const ni=idx+delta;
  if(ni<0||ni>=mergeFiles.length)return;
  [mergeFiles[idx],mergeFiles[ni]]=[mergeFiles[ni],mergeFiles[idx]];
  renderMergeList();refreshAbar();
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderMergeList(){
  const list=document.getElementById('mergeList');if(!list)return;
  if(!mergeFiles.length){list.innerHTML='';return;}
  list.innerHTML=mergeFiles.map((f,i)=>`
    <div class="merge-card">
      <div class="merge-thumb">
        ${f.thumb?`<img src="${f.thumb}" alt="">`:' <span class="merge-thumb-ico">📄</span>'}
      </div>
      <div class="merge-info">
        <span class="merge-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
        <span class="merge-meta">${f.pageCount} 頁</span>
      </div>
      <div class="merge-btns">
        <button class="mbtn" onclick="mergeMove(${f.id},-1)" ${i===0?'disabled':''} title="上移">↑</button>
        <button class="mbtn" onclick="mergeMove(${f.id},+1)" ${i===mergeFiles.length-1?'disabled':''} title="下移">↓</button>
        <button class="mbtn del-btn" onclick="mergeRemove(${f.id})" title="移除">✕</button>
      </div>
    </div>`).join('');
}

async function doMerge(){
  if(busy){showToast('請稍候…');return;}
  if(mergeFiles.length<2){showModal('⚠️','需要至少 2 個 PDF','請加入至少 2 個 PDF 檔案後再合併');return;}
  busy=true;
  document.getElementById('mergeProgWrap')?.classList.remove('hidden');
  try{
    setMergeProg(0,'開始合併…');
    const outDoc=await PDFDocument.create();
    for(let i=0;i<mergeFiles.length;i++){
      const mf=mergeFiles[i];
      setMergeProg(i/mergeFiles.length,`正在合併「${mf.name}」(${i+1}/${mergeFiles.length})…`);
      const src=await PDFDocument.load(mf.bytes,{ignoreEncryption:true});
      const idx=Array.from({length:mf.pageCount},(_,j)=>j);
      const copied=await outDoc.copyPages(src,idx);
      copied.forEach(p=>outDoc.addPage(p));
    }
    setMergeProg(.95,'儲存 PDF…');
    const outBytes=await outDoc.save();
    const blob=new Blob([outBytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const baseName=mergeFiles[0].name.replace(/\.pdf$/i,'');
    const a=Object.assign(document.createElement('a'),{href:url,download:baseName+'_merged.pdf'});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    const total=mergeFiles.reduce((s,f)=>s+f.pageCount,0);
    setMergeProg(1,`✅ 完成！共 ${mergeFiles.length} 個 PDF，${total} 頁`);
    showModal('✅','合併完成',`已成功合併 ${mergeFiles.length} 個 PDF\n新 PDF 共 ${total} 頁，已開始下載`);
  }catch(e){
    showModal('❌','合併失敗',e.message||'請重試');
    setMergeProg(0,'');
  }
  busy=false;
}

function setMergeProg(pct,lbl){
  const f=document.getElementById('mergeProgFill'),l=document.getElementById('mergeProgLbl'),w=document.getElementById('mergeProgWrap');
  if(w)w.classList.remove('hidden');
  if(f)f.style.width=Math.round(pct*100)+'%';
  if(l)l.textContent=lbl;
}


/* ════════════════════════════════════
   EXTRACT PAGES
════════════════════════════════════ */
async function extractPages(){
  if(busy){showToast('請稍候…');return;}
  if(!deletedPages.size){showModal('⚠️','未選取頁面','請先點選要提取的頁面');return;}

  busy=true;
  const exBtn=document.getElementById('extractBtn');
  if(exBtn){exBtn.disabled=true;exBtn.textContent='⏳ 處理中…';}

  // Pages to extract = selected pages, preserved in current display order
  const toExtract=pageOrder.filter(p=>deletedPages.has(p));

  try{
    const srcDoc=await PDFDocument.load(curBytes,{ignoreEncryption:true});
    const outDoc=await PDFDocument.create();
    for(const origPage of toExtract){
      const[pg]=await outDoc.copyPages(srcDoc,[origPage-1]);
      outDoc.addPage(pg);
    }
    const newBytes=await outDoc.save();
    const blob=new Blob([newBytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{
      href:url,
      download:fileName.replace(/\.pdf$/i,'')+'_extracted.pdf'
    });
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);

    // Offer to load the extracted PDF for further editing
    showModal('✅','提取完成',
      `已提取 ${toExtract.length} 頁，儲存為新 PDF 並開始下載。`);

  }catch(e){
    showModal('❌','提取失敗',e.message||'請重試');
  }

  busy=false;
  if(exBtn){exBtn.disabled=false;exBtn.textContent='✂️ 提取所選';}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
/* ════════════════════════════════════
   CONVERT MODE
════════════════════════════════════ */
let convFmt='images', convQ='medium', convPgMode='all';

const CONV_NOTES={
  images:'每頁輸出為獨立 PNG 圖片，打包成 ZIP 壓縮檔下載。',
  ppt:   '每頁轉為一張投影片的圖片，版面與原 PDF 完全相同，下載 PPTX 後以 PowerPoint 開啟。',
  word:  '每頁渲染成圖片嵌入 Word 文件，保留原始版面。如需可編輯文字請另行執行 OCR 識別。',
  excel: '擷取每頁的文字內容，每頁產生一個工作表。表格版面與圖片無法保留，僅支援文字內容。'
};
const CONV_Q_SCALE={low:1.5, medium:2.5, high:4.0};

function convInitPanel(){
  const convTo=document.getElementById('convTo');
  if(convTo)convTo.value=totalPages;
  const convFrom=document.getElementById('convFrom');
  if(convFrom)convFrom.max=convFrom.value=1;
  if(convTo)convTo.max=totalPages;
  convUpdateNote();
}
function convSetFmt(f){
  convFmt=f;
  document.querySelectorAll('[data-fmt]').forEach(b=>b.classList.toggle('active',b.dataset.fmt===f));
  document.getElementById('qualGrp').classList.toggle('hidden',f==='excel');
  convUpdateNote();
}
function convSetQ(q){
  convQ=q;
  document.querySelectorAll('[data-q]').forEach(b=>b.classList.toggle('active',b.dataset.q===q));
}
function convSetPg(m){
  convPgMode=m;
  document.querySelectorAll('[data-pg]').forEach(b=>b.classList.toggle('active',b.dataset.pg===m));
  document.getElementById('convRange').classList.toggle('hidden',m!=='range');
}
function convUpdateNote(){
  const el=document.getElementById('convNote');
  if(el)el.textContent=CONV_NOTES[convFmt]||'';
}
function convSetProgress(pct,lbl){
  const wrap=document.getElementById('convProgWrap'),fill=document.getElementById('convProgFill'),lblEl=document.getElementById('convProgLbl');
  if(wrap)wrap.classList.remove('hidden');
  if(fill)fill.style.width=Math.round(pct*100)+'%';
  if(lblEl)lblEl.textContent=lbl;
}
function convGetPages(){
  if(convPgMode==='all')return[...pageOrder];
  const from=parseInt(document.getElementById('convFrom')?.value)||1;
  const to  =parseInt(document.getElementById('convTo')?.value)||totalPages;
  return pageOrder.filter(p=>p>=from&&p<=to);
}

/* ── Load external libraries lazily ── */
let _convLibs=null;
async function ensureConvLibs(){
  if(_convLibs)return;
  const load=(src,test)=>new Promise((res,rej)=>{
    if(test())return res();
    const s=document.createElement('script');
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error('無法載入：'+src));
    document.head.appendChild(s);
  });
  await load('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',()=>window.JSZip);
  await load('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>window.XLSX);
  await load('https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.min.js',()=>window.PptxGenJS);
  _convLibs=true;
}

/* ── Main entry ── */
async function startConversion(){
  if(busy){showToast('請稍候…');return;}
  const pages=convGetPages();
  if(!pages.length){showModal('⚠️','無頁面','指定範圍內無頁面，請重新設定');return;}
  busy=true;
  document.getElementById('convProgWrap')?.classList.remove('hidden');
  try{
    convSetProgress(0,'載入函式庫…');
    await ensureConvLibs();
    const scale=CONV_Q_SCALE[convQ]||2.5;
    switch(convFmt){
      case 'images': await doConvImages(pages,scale); break;
      case 'ppt':    await doConvPPT(pages,scale);    break;
      case 'word':   await doConvWord(pages,scale);   break;
      case 'excel':  await doConvExcel(pages);        break;
    }
  }catch(e){
    showModal('❌','轉換失敗',e.message||'請重試');
    convSetProgress(0,'');
  }
  busy=false;
}

/* ── Render page to canvas ── */
async function convRenderPage(origPage,scale){
  const page=await pdfJsDoc.getPage(origPage);
  const vp0=page.getViewport({scale:1});
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');
  cv.width=vp.width; cv.height=vp.height;
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  return{canvas:cv,pdfW:vp0.width,pdfH:vp0.height};
}

function blobFromCanvas(cv,type,quality){
  return new Promise(res=>cv.toBlob(res,type,quality));
}

function dlBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
}

function convBaseName(){return fileName.replace(/\.pdf$/i,'');}

/* ── PNG Images → ZIP ── */
async function doConvImages(pages,scale){
  const zip=new JSZip();
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`渲染第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas}=await convRenderPage(pages[i],scale);
    const blob=await blobFromCanvas(canvas,'image/png');
    zip.file(`page_${String(i+1).padStart(3,'0')}.png`,blob);
  }
  convSetProgress(.95,'壓縮中…');
  const zipBlob=await zip.generateAsync(
    {type:'blob',compression:'DEFLATE',compressionOptions:{level:6}},
    m=>convSetProgress(.95+m.percent/100*.05,`壓縮 ${Math.round(m.percent)}%…`)
  );
  dlBlob(zipBlob,convBaseName()+'_images.zip');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 張圖片`);
}

/* ── PowerPoint ── */
async function doConvPPT(pages,scale){
  const pptx=new PptxGenJS();
  let wIn=10,hIn=7.5;
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`轉換第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas,pdfW,pdfH}=await convRenderPage(pages[i],scale);
    if(i===0){
      // Set slide size to match PDF aspect
      wIn=10; hIn=Math.round(10*(pdfH/pdfW)*100)/100;
      pptx.defineLayout({name:'PDF',width:wIn,height:hIn});
      pptx.layout='PDF';
    }
    const blob=await blobFromCanvas(canvas,'image/jpeg',.92);
    const b64=await new Promise(res=>{
      const r=new FileReader(); r.onload=()=>res(r.result.split(',')[1]); r.readAsDataURL(blob);
    });
    const slide=pptx.addSlide();
    slide.addImage({data:'image/jpeg;base64,'+b64,x:0,y:0,w:wIn,h:hIn});
  }
  convSetProgress(.9,'生成 PPTX…');
  const pptxBlob=await pptx.write('blob');
  dlBlob(pptxBlob,convBaseName()+'.pptx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 張投影片`);
}

/* ── Word DOCX (each page as image) ── */
async function doConvWord(pages,scale){
  const zip=new JSZip();
  const MAX_W_EMU=6096000; // ~16.9cm usable width
  let docBody='',relsBody='',firstPdfW=595,firstPdfH=842;
  const imgs=[];

  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`渲染第 ${pages[i]} 頁 (${i+1}/${pages.length})…`);
    const{canvas,pdfW,pdfH}=await convRenderPage(pages[i],scale);
    if(i===0){firstPdfW=pdfW;firstPdfH=pdfH;}
    const blob=await blobFromCanvas(canvas,'image/jpeg',.9);
    const rId=`rId${i+1}`;
    const cy=Math.round(MAX_W_EMU*pdfH/pdfW);
    relsBody+=`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/p${i+1}.jpg"/>`;
    docBody+=docxImgPara(rId,i+1,MAX_W_EMU,cy);
    if(i<pages.length-1)docBody+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    imgs.push({name:`p${i+1}.jpg`,blob});
  }

  const pgW=Math.round(firstPdfW*20);   // pt→twips (1pt=20twips)
  const pgH=Math.round(firstPdfH*20);

  zip.file('[Content_Types].xml',docxCT(pages.length));
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/document.xml',docxDocument(docBody,pgW,pgH));
  zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+relsBody+'</Relationships>');
  for(const{name,blob}of imgs)zip.file('word/media/'+name,blob);

  convSetProgress(.9,'生成 DOCX…');
  const docxBlob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  dlBlob(docxBlob,convBaseName()+'.docx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 頁`);
}

function docxCT(n){
  let overrides='';
  for(let i=1;i<=n;i++)overrides+=`<Override PartName="/word/media/p${i}.jpg" ContentType="image/jpeg"/>`;
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>${overrides}</Types>`;
}
function docxDocument(body,pgW,pgH){
  const margin=567; // ~1 cm in twips
  return`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><w:body>${body}<w:sectPr><w:pgSz w:w="${pgW}" w:h="${pgH}"/><w:pgMar w:top="${margin}" w:right="${margin}" w:bottom="${margin}" w:left="${margin}"/></w:sectPr></w:body></w:document>`;
}
function docxImgPara(rId,idx,cx,cy){
  return`<w:p><w:r><w:drawing><wp:inline><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${idx}" name="p${idx}"/><a:graphic><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic><pic:nvPicPr><pic:cNvPr id="${idx}" name="p${idx}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>`;
}

/* ── Excel XLSX (text extraction) ── */
async function doConvExcel(pages){
  const wb=XLSX.utils.book_new();
  for(let i=0;i<pages.length;i++){
    convSetProgress(i/pages.length,`擷取第 ${pages[i]} 頁文字 (${i+1}/${pages.length})…`);
    const page=await pdfJsDoc.getPage(pages[i]);
    const tc=await page.getTextContent();
    // Sort top-to-bottom, left-to-right
    const sorted=[...tc.items].filter(it=>it.str?.trim()).sort((a,b)=>{
      const dy=b.transform[5]-a.transform[5];
      return Math.abs(dy)>3?dy:a.transform[4]-b.transform[4];
    });
    // Group into lines
    const lines=[]; let curY=null,curLine=[];
    for(const it of sorted){
      const y=Math.round(it.transform[5]);
      if(curY===null||Math.abs(y-curY)>4){
        if(curLine.length)lines.push(curLine.join(' '));
        curLine=[it.str]; curY=y;
      }else curLine.push(it.str);
    }
    if(curLine.length)lines.push(curLine.join(' '));
    const aoa=lines.length?lines.map(l=>[l]):[['（此頁無文字內容）']];
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:80}];
    const name=`第${pages[i]}頁`.slice(0,31);
    XLSX.utils.book_append_sheet(wb,ws,name);
  }
  convSetProgress(.95,'生成 XLSX…');
  const arr=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  dlBlob(new Blob([arr],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),convBaseName()+'.xlsx');
  convSetProgress(1,`✅ 完成！共 ${pages.length} 個工作表`);
}


/* ════════════════════════════════════
   MERGE MODE
════════════════════════════════════ */
let mergeFiles=[], _mergeIdSeq=0;

/* Drop zone */
document.getElementById('mergeDrop').addEventListener('dragover',e=>{e.preventDefault();document.getElementById('mergeDrop').classList.add('over');});
document.getElementById('mergeDrop').addEventListener('dragleave',()=>document.getElementById('mergeDrop').classList.remove('over'));
document.getElementById('mergeDrop').addEventListener('drop',e=>{
  e.preventDefault();document.getElementById('mergeDrop').classList.remove('over');
  const files=[...e.dataTransfer.files].filter(f=>f.type==='application/pdf');
  if(files.length)mergeAdd(files);
  else showToast('⚠️ 請選擇 PDF 格式的檔案');
});
document.getElementById('mergeFileInput').addEventListener('change',e=>{mergeAdd([...e.target.files]);e.target.value='';});

async function mergeAdd(files){
  for(const file of files){
    if(file.type!=='application/pdf'){showToast(`⚠️ ${file.name} 不是 PDF 格式`);continue;}
    try{
      const bytes=new Uint8Array(await file.arrayBuffer());
      const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
      const id=++_mergeIdSeq;
      // Render first-page thumbnail (40 px wide)
      let thumb='';
      try{
        const pg=await doc.getPage(1);
        const vp0=pg.getViewport({scale:1});
        const vp=pg.getViewport({scale:40/vp0.width});
        const cv=document.createElement('canvas');
        cv.width=vp.width;cv.height=vp.height;
        await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
        thumb=cv.toDataURL('image/jpeg',.75);
      }catch(_){}
      mergeFiles.push({id,name:file.name,bytes,pageCount:doc.numPages,thumb});
    }catch(e){showToast(`❌ 無法讀取 ${file.name}`);}
  }
  renderMergeList();
  if(mode==='merge')refreshAbar();
}

function mergeRemove(id){
  mergeFiles=mergeFiles.filter(f=>f.id!==id);
  renderMergeList();refreshAbar();
}

function mergeMove(id,delta){
  const idx=mergeFiles.findIndex(f=>f.id===id);
  if(idx<0)return;
  const ni=idx+delta;
  if(ni<0||ni>=mergeFiles.length)return;
  [mergeFiles[idx],mergeFiles[ni]]=[mergeFiles[ni],mergeFiles[idx]];
  renderMergeList();refreshAbar();
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderMergeList(){
  const list=document.getElementById('mergeList');if(!list)return;
  if(!mergeFiles.length){list.innerHTML='';return;}
  list.innerHTML=mergeFiles.map((f,i)=>`
    <div class="merge-card">
      <div class="merge-thumb">
        ${f.thumb?`<img src="${f.thumb}" alt="">`:' <span class="merge-thumb-ico">📄</span>'}
      </div>
      <div class="merge-info">
        <span class="merge-name" title="${escHtml(f.name)}">${escHtml(f.name)}</span>
        <span class="merge-meta">${f.pageCount} 頁</span>
      </div>
      <div class="merge-btns">
        <button class="mbtn" onclick="mergeMove(${f.id},-1)" ${i===0?'disabled':''} title="上移">↑</button>
        <button class="mbtn" onclick="mergeMove(${f.id},+1)" ${i===mergeFiles.length-1?'disabled':''} title="下移">↓</button>
        <button class="mbtn del-btn" onclick="mergeRemove(${f.id})" title="移除">✕</button>
      </div>
    </div>`).join('');
}

async function doMerge(){
  if(busy){showToast('請稍候…');return;}
  if(mergeFiles.length<2){showModal('⚠️','需要至少 2 個 PDF','請加入至少 2 個 PDF 檔案後再合併');return;}
  busy=true;
  document.getElementById('mergeProgWrap')?.classList.remove('hidden');
  try{
    setMergeProg(0,'開始合併…');
    const outDoc=await PDFDocument.create();
    for(let i=0;i<mergeFiles.length;i++){
      const mf=mergeFiles[i];
      setMergeProg(i/mergeFiles.length,`正在合併「${mf.name}」(${i+1}/${mergeFiles.length})…`);
      const src=await PDFDocument.load(mf.bytes,{ignoreEncryption:true});
      const idx=Array.from({length:mf.pageCount},(_,j)=>j);
      const copied=await outDoc.copyPages(src,idx);
      copied.forEach(p=>outDoc.addPage(p));
    }
    setMergeProg(.95,'儲存 PDF…');
    const outBytes=await outDoc.save();
    const blob=new Blob([outBytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const baseName=mergeFiles[0].name.replace(/\.pdf$/i,'');
    const a=Object.assign(document.createElement('a'),{href:url,download:baseName+'_merged.pdf'});
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);
    const total=mergeFiles.reduce((s,f)=>s+f.pageCount,0);
    setMergeProg(1,`✅ 完成！共 ${mergeFiles.length} 個 PDF，${total} 頁`);
    showModal('✅','合併完成',`已成功合併 ${mergeFiles.length} 個 PDF\n新 PDF 共 ${total} 頁，已開始下載`);
  }catch(e){
    showModal('❌','合併失敗',e.message||'請重試');
    setMergeProg(0,'');
  }
  busy=false;
}

function setMergeProg(pct,lbl){
  const f=document.getElementById('mergeProgFill'),l=document.getElementById('mergeProgLbl'),w=document.getElementById('mergeProgWrap');
  if(w)w.classList.remove('hidden');
  if(f)f.style.width=Math.round(pct*100)+'%';
  if(l)l.textContent=lbl;
}


/* ════════════════════════════════════
   EXTRACT PAGES
════════════════════════════════════ */
async function extractPages(){
  if(busy){showToast('請稍候…');return;}
  if(!deletedPages.size){showModal('⚠️','未選取頁面','請先點選要提取的頁面');return;}

  busy=true;
  const exBtn=document.getElementById('extractBtn');
  if(exBtn){exBtn.disabled=true;exBtn.textContent='⏳ 處理中…';}

  // Pages to extract = selected pages, preserved in current display order
  const toExtract=pageOrder.filter(p=>deletedPages.has(p));

  try{
    const srcDoc=await PDFDocument.load(curBytes,{ignoreEncryption:true});
    const outDoc=await PDFDocument.create();
    for(const origPage of toExtract){
      const[pg]=await outDoc.copyPages(srcDoc,[origPage-1]);
      outDoc.addPage(pg);
    }
    const newBytes=await outDoc.save();
    const blob=new Blob([newBytes],{type:'application/pdf'});
    const url=URL.createObjectURL(blob);
    const a=Object.assign(document.createElement('a'),{
      href:url,
      download:fileName.replace(/\.pdf$/i,'')+'_extracted.pdf'
    });
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),8000);

    // Offer to load the extracted PDF for further editing
    showModal('✅','提取完成',
      `已提取 ${toExtract.length} 頁，儲存為新 PDF 並開始下載。`);

  }catch(e){
    showModal('❌','提取失敗',e.message||'請重試');
  }

  busy=false;
  if(exBtn){exBtn.disabled=false;exBtn.textContent='✂️ 提取所選';}
}

</script>
<style>

}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100dvh}

.btn:active{transform:scale(.95)}
.btn-acc{background:var(--acc);color:#fff}.btn-acc:hover{background:var(--acc-dk);box-shadow:var(--s2)}

.hint-bar.on{display:flex}

.hint-mark{background:linear-gradient(90deg,#f0fff4,#f5fffa);color:var(--grn)}

/* ─── GRID TOOLBAR ─── */
.gtb{background:var(--surf);border-bottom:1px solid var(--border);padding:8px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.gtb-l{display:flex;align-items:center;gap:7px;flex-wrap:wrap;min-width:0}
.gtb-r{display:flex;gap:5px;flex-shrink:0}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:.74rem;font-weight:600}
.chip-f{background:var(--acc-dim);color:var(--acc);max-width:155px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip-p{background:var(--bg);color:var(--ink2)}

/* ─── PAGES GRID ─── */
.pages-wrap{padding:10px 10px 130px}
.pages-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
@media(min-width:600px){.pages-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.pages-wrap{padding:12px 14px 130px}}

/* ─── PAGE CARD ─── */
.pcard{background:var(--surf);border:2px solid transparent;border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .12s,opacity .15s;box-shadow:var(--s1);user-select:none;-webkit-user-select:none;position:relative;-webkit-tap-highlight-color:transparent}
.pcard:active{transform:scale(.95)}
.pcard.del-sel{border-color:var(--del);box-shadow:0 0 0 1px var(--del),var(--s2)}
.del-ov{position:absolute;inset:0;background:var(--del-mid);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;pointer-events:none}
.pcard.del-sel .del-ov{opacity:1}
.del-x{background:var(--del);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;font-weight:800;box-shadow:var(--s2);transform:scale(.5);transition:transform .15s}
.pcard.del-sel .del-x{transform:scale(1)}
.pthumb{position:relative;width:100%;aspect-ratio:.707;background:#dde3ec;overflow:hidden}
.pthumb canvas{display:block;width:100%;height:100%;object-fit:contain}
.skel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#dde3ec}
.spin{width:20px;height:20px;border:2.5px solid #b0b8c8;border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sort-hdl{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(79,110,247,.06);cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent}
.sort-hdl:active{cursor:grabbing}
.hdl-icon{background:rgba(255,255,255,.92);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:1.3rem;color:var(--acc);box-shadow:var(--s2);line-height:1;letter-spacing:2px}
.pos-num{position:absolute;top:5px;right:5px;background:var(--acc);color:#fff;border-radius:7px;padding:2px 7px;font-size:.68rem;font-weight:800;opacity:0;pointer-events:none;z-index:2;box-shadow:var(--s1)}
.mk-badge{position:absolute;top:5px;left:5px;background:var(--grn);color:#fff;border-radius:6px;padding:2px 6px;font-size:.65rem;font-weight:800;pointer-events:none;z-index:3;box-shadow:var(--s1)}
.pages-grid.sort-mode .pcard{cursor:default;border-color:rgba(79,110,247,.2)}
.pages-grid.sort-mode .sort-hdl{display:flex}
.pages-grid.sort-mode .pcard:active{transform:none}
.pages-grid.sort-mode .pos-num{opacity:1}
.pages-grid.mk-mode .sort-hdl{display:none!important}
.pages-grid.mk-mode .pcard:hover{border-color:var(--grn);box-shadow:0 0 0 1px var(--grn),var(--s2)}
.pcard.dnd-src{opacity:.25;transform:scale(.96)}
.pcard.drop-over{outline:3px solid var(--acc);outline-offset:-2px;background:var(--acc-dim);transform:scale(.98)}
.dnd-ghost{position:fixed;pointer-events:none;z-index:999;opacity:.92;transform:rotate(2deg) scale(1.08);box-shadow:0 14px 42px rgba(0,0,0,.26);border-radius:var(--r);overflow:hidden}
.pfoot{padding:6px 8px;text-align:center;font-size:.73rem;font-weight:500;color:var(--ink2);border-top:1px solid var(--border);transition:background .15s,color .15s}
.pcard.del-sel .pfoot{background:var(--del-dim);color:var(--del);font-weight:700}
.pages-grid.sort-mode .pfoot{color:var(--acc);font-weight:600}

/* ─── ACTION BAR ─── */
.abar{position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-top:1px solid var(--border);padding:11px 16px;padding-bottom:max(11px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;box-shadow:0 -4px 18px rgba(0,0,0,.09);z-index:20}
.abar-info{flex:1;min-width:0}
.abar-count{font-size:.97rem;font-weight:800;display:block}
.abar-hint{font-size:.73rem;color:var(--ink2);display:block;margin-top:1px}

/* ══════════════════════════════════
   PAGE EDITOR MODAL
══════════════════════════════════ */
#editorModal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:40;display:flex;align-items:stretch;justify-content:center}
@media(min-width:700px){#editorModal{align-items:center;padding:14px}}
.ebox{background:var(--surf);display:flex;flex-direction:column;width:100%;max-width:900px;overflow:hidden}
@media(min-width:700px){.ebox{border-radius:18px;max-height:calc(100dvh - 28px)}}

/* editor header */
.ebox-hdr{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.ebox-title{font-size:.9rem;font-weight:700;flex:1;text-align:center}
.ebox-hdr-r{display:flex;gap:5px;flex-shrink:0}

/* editor tools */
.ebox-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--border);background:#fafbfd;flex-shrink:0;row-gap:8px}
#dynTools{display:contents}
.tool-grp{display:flex;align-items:center;gap:5px;flex-shrink:0}
.tool-lbl{font-size:.72rem;color:var(--ink2);font-weight:700;flex-shrink:0}
.tool-sep{width:1px;height:22px;background:var(--border);flex-shrink:0;margin:0 1px}

/* shape / text buttons */
.shp-btn{width:34px;height:34px;border:2px solid var(--border);border-radius:8px;background:transparent;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent;color:var(--ink2)}
.shp-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.shp-btn:hover:not(.active){border-color:var(--ink3);background:var(--bg)}

/* color swatches */
.c-sw{width:30px;height:30px;border-radius:7px;border:2.5px solid var(--border);cursor:pointer;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.c-sw.active{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc);transform:scale(1.12)}
.c-sw[data-c="red"]{background:#e53e3e;border-color:#e53e3e}
.c-sw[data-c="white"]{background:#fff}
.c-sw[data-c="transparent"]{background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;background-color:#fff}

/* stroke width buttons */
.sw-btn{width:30px;height:30px;border:2px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;-webkit-tap-highlight-color:transparent}
.sw-btn.active{border-color:var(--acc);background:var(--acc-dim)}
.sw-btn span{background:var(--ink2);border-radius:99px;width:60%;display:block}

/* font / size buttons */
.font-btn{padding:5px 9px;border:2px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--ink2);transition:all .15s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.font-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.font-btn:hover:not(.active){border-color:var(--ink3);background:var(--bg)}
.sz-btn{padding:5px 8px;min-width:30px;text-align:center;border:2px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.78rem;font-weight:700;color:var(--ink2);transition:all .15s;-webkit-tap-highlight-color:transparent}
.sz-btn.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.sz-btn:hover:not(.active){border-color:var(--ink3);background:var(--bg)}

/* text input row */
.text-row{border-bottom:1px solid var(--border);padding:9px 14px;background:var(--grn-dim);flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.text-row input{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:1rem;outline:none;background:#fff;color:var(--ink);-webkit-appearance:none}
.text-row input:focus{border-color:var(--grn)}
.text-row small{font-size:.71rem;color:var(--ink2)}

/* ─── ZOOM BAR ─── */
.zoom-bar{display:flex;align-items:center;justify-content:center;gap:5px;padding:7px 14px;border-bottom:1px solid var(--border);background:#f0f2f8;flex-shrink:0}
.zoom-btn{width:34px;height:34px;border:1.5px solid var(--border);border-radius:9px;background:var(--surf);cursor:pointer;font-size:1.1rem;font-weight:700;display:flex;align-items:center;justify-content:center;transition:all .15s;color:var(--ink2);-webkit-tap-highlight-color:transparent;flex-shrink:0}
.zoom-btn:hover{background:var(--bg);border-color:var(--ink3)}
.zoom-btn:active{transform:scale(.9)}
.zoom-pct{min-width:52px;text-align:center;font-size:.82rem;font-weight:700;color:var(--ink);background:var(--surf);border:1.5px solid var(--border);border-radius:8px;padding:5px 4px;flex-shrink:0}
.zoom-sep{width:1px;height:20px;background:var(--border);margin:0 3px;flex-shrink:0}
.zoom-label-btn{padding:5px 10px;border:1.5px solid var(--border);border-radius:9px;background:var(--surf);cursor:pointer;font-size:.78rem;font-weight:700;color:var(--ink2);white-space:nowrap;transition:all .15s;-webkit-tap-highlight-color:transparent}
.zoom-label-btn:hover{background:var(--bg);border-color:var(--ink3)}
.zoom-label-btn:active{transform:scale(.95)}

/* canvas area */
.ebox-cv-area{flex:1;overflow:auto;background:#444;display:flex;align-items:flex-start;justify-content:center;padding:14px;min-height:180px;position:relative}
.cv-cont{position:relative;flex-shrink:0;box-shadow:0 8px 40px rgba(0,0,0,.5);cursor:crosshair}
#bgCv{display:block}
#drawCv{display:block;position:absolute;top:0;left:0;touch-action:none}
#drawCv.text-cursor{cursor:text}

/* ─── INFO MODAL ─── */
.modal-bd{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--surf);border-radius:18px;padding:26px 22px;max-width:320px;width:100%;text-align:center;box-shadow:var(--s3)}
.modal-box .mico{font-size:2.6rem;display:block;margin-bottom:10px}
.modal-box h3{font-size:1.05rem;font-weight:700;margin-bottom:7px}
.modal-box p{font-size:.87rem;color:var(--ink2);margin-bottom:18px;line-height:1.55}

/* ─── TOAST ─── */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(14px);background:#1a202c;color:#fff;padding:9px 18px;border-radius:28px;font-size:.83rem;font-weight:600;opacity:0;transition:opacity .22s,transform .22s;z-index:100;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none!important}

/* ─── CONVERT PANEL ─── */
.conv-panel{padding:14px 14px 10px;background:var(--surf);border-bottom:1px solid var(--border)}
.conv-fmts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.fmt-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border:2px solid var(--border);border-radius:var(--r);background:var(--bg);cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent}
.fmt-btn.active{border-color:var(--acc);background:var(--acc-dim)}
.fmt-btn:hover:not(.active){border-color:var(--ink3)}
.fmt-ico{font-size:1.6rem;line-height:1}
.fmt-nm{font-size:.75rem;font-weight:700;color:var(--ink);margin-top:1px}
.fmt-ext{font-size:.64rem;color:var(--ink2)}
.fmt-btn.active .fmt-nm{color:var(--acc)}
.conv-opts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:8px}
.conv-opt-g{display:flex;align-items:center;gap:5px}
.conv-lbl{font-size:.72rem;color:var(--ink2);font-weight:700;flex-shrink:0}
.conv-ob{padding:5px 9px;border:1.5px solid var(--border);border-radius:7px;background:transparent;cursor:pointer;font-size:.78rem;font-weight:600;color:var(--ink2);transition:all .15s;-webkit-tap-highlight-color:transparent}
.conv-ob.active{border-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.conv-ob:hover:not(.active){border-color:var(--ink3);background:var(--bg)}
.conv-range{display:flex;align-items:center;gap:5px;font-size:.82rem;color:var(--ink2)}
.conv-range input{width:52px;padding:4px 6px;border:1.5px solid var(--border);border-radius:6px;text-align:center;font-size:.82rem;outline:none;-webkit-appearance:none}
.conv-range input:focus{border-color:var(--acc)}
.conv-note{font-size:.73rem;color:var(--ink2);line-height:1.55;padding:4px 0 2px}
.conv-prog-wrap{margin-top:10px}
.conv-prog-bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-bottom:5px}
.conv-prog-fill{height:100%;background:var(--acc);border-radius:99px;width:0%;transition:width .2s}
.conv-prog-lbl{font-size:.74rem;color:var(--ink2)}

/* ─── MERGE PANEL ─── */
.merge-panel{padding:14px;background:var(--surf);border-bottom:1px solid var(--border)}
.merge-drop{border:2px dashed var(--border);border-radius:var(--r);padding:18px 16px;text-align:center;cursor:pointer;transition:all .18s;background:var(--bg);margin-bottom:12px}
.merge-drop:hover,.merge-drop.over{border-color:var(--acc);background:var(--acc-dim)}
.merge-drop-ico{font-size:2rem;display:block;margin-bottom:8px}
.merge-drop p{font-size:.83rem;color:var(--ink2);margin-bottom:10px}
.merge-list{display:flex;flex-direction:column;gap:7px;margin-bottom:8px}
.merge-card{display:flex;align-items:center;gap:9px;background:var(--surf);border:1.5px solid var(--border);border-radius:10px;padding:9px 11px}
.merge-thumb{width:34px;flex-shrink:0;border-radius:3px;overflow:hidden;background:#dde3ec;display:flex;align-items:center;justify-content:center;min-height:46px}
.merge-thumb img{width:100%;display:block}
.merge-thumb-ico{font-size:1.2rem;padding:4px 0}
.merge-info{flex:1;min-width:0}
.merge-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.merge-meta{font-size:.7rem;color:var(--ink2);margin-top:2px;display:block}
.merge-btns{display:flex;gap:3px;flex-shrink:0}
.mbtn{width:28px;height:28px;border:1.5px solid var(--border);border-radius:6px;background:transparent;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;transition:all .15s;-webkit-tap-highlight-color:transparent;color:var(--ink2)}
.mbtn:hover{background:var(--bg);border-color:var(--ink3)}
.mbtn.del-btn:hover{background:var(--del-dim);border-color:var(--del);color:var(--del)}
.mbtn[disabled]{opacity:.3;cursor:not-allowed;pointer-events:none}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-ico">📄</div>
  <div><h1>PDF 頁面編輯</h1><p>刪除 · 排序 · 圖形 · 文字標記</p></div>
</header>

<!-- UPLOAD -->
<div id="uploadSection">
  <div style="padding:24px 16px;max-width:500px;margin:0 auto">
    <div class="drop-zone" id="dropZone">
      <span class="drop-icon">📂</span>
      <h2>上傳 PDF 檔案</h2>
      <p>拖曳至此，或點擊選擇</p>
      <button class="btn btn-acc" onclick="event.stopPropagation();fileInput.click()">📁 選擇檔案</button>
    </div>
    <input type="file" id="fileInput" accept="application/pdf" style="display:none">
  </div>
</div>

<!-- EDITOR -->
<div id="editorSection" class="hidden">
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-delete" onclick="setMode('delete')">🗑️ 刪除</button>
    <button class="mode-tab"        id="tab-sort"   onclick="setMode('sort')">🔀 排序</button>
    <button class="mode-tab"        id="tab-markup" onclick="setMode('markup')">🖊️ 標記</button>
    <button class="mode-tab"        id="tab-conv"   onclick="setMode('convert')">🔄 轉換</button>
    <button class="mode-tab" id="tab-merge" onclick="setMode('merge')">🔗 合併</button>
  </div>

  <!-- Conversion panel (convert mode) -->
  <div id="convPanel" class="conv-panel hidden">
    <div class="conv-fmts">
      <button class="fmt-btn active" data-fmt="images" onclick="convSetFmt('images')"><div class="fmt-ico">🖼️</div><div class="fmt-nm">圖片</div><div class="fmt-ext">PNG / ZIP</div></button>
      <button class="fmt-btn" data-fmt="ppt" onclick="convSetFmt('ppt')"><div class="fmt-ico">📽️</div><div class="fmt-nm">PowerPoint</div><div class="fmt-ext">PPTX</div></button>
      <button class="fmt-btn" data-fmt="word" onclick="convSetFmt('word')"><div class="fmt-ico">📝</div><div class="fmt-nm">Word</div><div class="fmt-ext">DOCX</div></button>
      <button class="fmt-btn" data-fmt="excel" onclick="convSetFmt('excel')"><div class="fmt-ico">📊</div><div class="fmt-nm">Excel</div><div class="fmt-ext">XLSX</div></button>
    </div>
    <div class="conv-opts">
      <div class="conv-opt-g" id="qualGrp">
        <span class="conv-lbl">品質</span>
        <button class="conv-ob" data-q="low" onclick="convSetQ('low')">低</button>
        <button class="conv-ob active" data-q="medium" onclick="convSetQ('medium')">中</button>
        <button class="conv-ob" data-q="high" onclick="convSetQ('high')">高</button>
      </div>
      <div class="conv-opt-g">
        <span class="conv-lbl">頁面</span>
        <button class="conv-ob active" data-pg="all" onclick="convSetPg('all')">全部</button>
        <button class="conv-ob" data-pg="range" onclick="convSetPg('range')">範圍</button>
      </div>
      <div class="conv-range hidden" id="convRange">
        第 <input type="number" id="convFrom" min="1" value="1"> 至 <input type="number" id="convTo" min="1" value="1"> 頁
      </div>
    </div>
    <div class="conv-note" id="convNote">每頁輸出為獨立 PNG 圖片，打包成 ZIP 壓縮檔下載。</div>
    <div class="conv-prog-wrap hidden" id="convProgWrap">
      <div class="conv-prog-bar"><div class="conv-prog-fill" id="convProgFill"></div></div>
      <div class="conv-prog-lbl" id="convProgLbl">準備中…</div>
    </div>
  </div>

  <!-- Merge panel -->
  <div id="mergePanel" class="merge-panel hidden">
    <div class="merge-drop" id="mergeDrop" onclick="mergeFileInput.click()">
      <span class="merge-drop-ico">📎</span>
      <p>拖曳多個 PDF 至此，或點擊選擇</p>
      <button class="btn btn-acc btn-sm" onclick="event.stopPropagation();mergeFileInput.click()">+ 加入 PDF 檔案</button>
    </div>
    <input type="file" id="mergeFileInput" accept="application/pdf" multiple style="display:none">
    <div id="mergeList" class="merge-list"></div>
    <div class="conv-prog-wrap hidden" id="mergeProgWrap">
      <div class="conv-prog-bar"><div class="conv-prog-fill" id="mergeProgFill"></div></div>
      <div class="conv-prog-lbl" id="mergeProgLbl"></div>
    </div>
  </div>
  <div class="hint-bar hint-sort" id="sortHint">⠿ 點住縮圖並拖曳以調整順序</div>
  <div class="hint-bar hint-mark" id="markHint">🖊️ 點選縮圖開啟放大編輯器，加入圖形或文字</div>
  <div class="gtb">
    <div class="gtb-l">
      <span class="chip chip-f" id="fileChip" title="">file.pdf</span>
      <span class="chip chip-p" id="pagesChip">0 頁</span>
    </div>
    <div class="gtb-r" id="toolbarR"></div>
  </div>
  <div class="pages-wrap" id="pagesWrap">
    <div class="pages-grid" id="pagesGrid"></div>
  </div>
  <div class="abar">
    <div class="abar-info">
      <span class="abar-count" id="abarCount" style="color:var(--ink3)">尚無變更</span>
      <span class="abar-hint"  id="abarHint">編輯後點擊下載</span>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0;align-items:center">
      <button class="btn btn-sm hidden" id="extractBtn" onclick="extractPages()" style="background:var(--acc);color:#fff">✂️ 提取所選</button>
      <button class="btn btn-grn" id="dlBtn" onclick="downloadPDF()">⬇️ 下載 PDF</button>
    </div>
  </div>
</div>

<!-- PAGE EDITOR MODAL -->
<div id="editorModal" class="hidden">
  <div class="ebox">
    <!-- header -->
    <div class="ebox-hdr">
      <button class="btn btn-ghost btn-sm" onclick="closeEditor()">✕ 關閉</button>
      <span class="ebox-title" id="editorTitle">第 N 頁</span>
      <div class="ebox-hdr-r">
        <button class="btn btn-ghost btn-sm" onclick="undoShape()">↩ 還原</button>
        <button class="btn btn-ghost btn-sm" onclick="clearPageShapes()">🗑</button>
      </div>
    </div>

    <!-- tools: static shape buttons + dynamic section -->
    <div class="ebox-tools">
      <div class="tool-grp">
        <span class="tool-lbl">工具</span>
        <button class="shp-btn active" id="stRect"    onclick="selectTool('rect')"   title="矩形">▭</button>
        <button class="shp-btn"        id="stEllipse" onclick="selectTool('ellipse')" title="橢圓">○</button>
        <button class="shp-btn"        id="stLine"    onclick="selectTool('line')"    title="直線">╱</button>
        <button class="shp-btn"        id="stText"    onclick="selectTool('text')"    title="文字" style="font-weight:800;font-size:1.05rem">文</button>
      </div>
      <div id="dynTools"></div>
    </div>

    <!-- text input row (text tool only) -->
    <div class="text-row hidden" id="textRow">
      <input type="text" id="textInput" placeholder="在此輸入文字，然後點選頁面放置…"
             maxlength="200" autocomplete="off" autocorrect="off" spellcheck="false">
      <small>點選頁面任意位置放置文字；可多次點選放置多個</small>
    </div>

    <!-- zoom bar -->
    <div class="zoom-bar">
      <button class="zoom-btn"       onclick="doZoom(-0.25)" title="縮小">−</button>
      <span   class="zoom-pct"       id="zoomLabel">100%</span>
      <button class="zoom-btn"       onclick="doZoom(+0.25)" title="放大">+</button>
      <div class="zoom-sep"></div>
      <button class="zoom-label-btn" onclick="doZoom(0,'fit')"  title="縮放至適合視窗">⊡ 適合</button>
      <button class="zoom-label-btn" onclick="doZoom(0,'1:1')"  title="100% 原始大小">1:1</button>
      <button class="zoom-label-btn" onclick="doZoom(0,'2:1')"  title="200% 放大">2×</button>
    </div>

    <!-- canvas -->
    <div class="ebox-cv-area" id="eboxCvArea">
      <div class="cv-cont" id="cvCont">
        <canvas id="bgCv"></canvas>
        <canvas id="drawCv"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- INFO MODAL -->
<div class="modal-bd hidden" id="modalBd" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <span class="mico" id="mIco">✅</span>
    <h3 id="mTitle">提示</h3>
    <p  id="mMsg">訊息</p>
    <button class="btn btn-acc" onclick="closeModal()" style="width:100%">確定</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════
   SETUP
════════════════════════════════════ */
const { PDFDocument, rgb: pdfRGB } = PDFLib;
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const FONT_CSS = {
  biaukai: "'BiauKai','DFKai-SB','標楷體','KaiTi',cursive",
  heiti:   "'PingFang TC','Microsoft JhengHei','微軟正黑體',sans-serif",
  songti:  "'Songti TC','MingLiU','新細明體',serif"
};
const TEXT_COLOR_CSS = { black:'#111111', blue:'#1a56db', red:'#e53e3e' };

/* ════════════════════════════════════
   STATE
════════════════════════════════════ */
let mode='delete', pageOrder=[], deletedPages=new Set();
let pageShapes={}, curBytes=null, pdfJsDoc=null;
let totalPages=0, fileName='document.pdf', busy=false;

// DnD
let dndActive=false,dndSrcIdx=null,dndDropIdx=null,dndGhost=null,dndOffset={x:0,y:0},dndSrcCard=null;

// Editor tools
let editingPage=null, currentTool='rect';
let strokeColor='red', fillColor='transparent', strokeWidth=2;
let currentFont='biaukai', currentFontSize=24, textColor='black';
let editorCvW=0, editorCvH=0, isDrawing=false, drawStart=null;

// Zoom
let zoomLevel=1.0;
const ZOOM_MIN=0.25, ZOOM_MAX=5.0;

// Pinch
let _pinching=false, _pinchDist0=null, _pinchZoom0=null;

/* ════════════════════════════════════
   UPLOAD
════════════════════════════════════ */
const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.classList.add('over');});
dropZone.addEventListener('dragleave',()=>dropZone.classList.remove('over'));
dropZone.addEventListener('drop',e=>{
  e.preventDefault();dropZone.classList.remove('over');
  const f=e.dataTransfer.files[0];
  if(f?.type==='application/pdf')loadFile(f);
  else showModal('❌','格式不符','請選擇 .pdf 格式的檔案');
});
dropZone.addEventListener('click',()=>fileInput.click());
fileInput.addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
async function loadFile(f){fileName=f.name;await initPDF(new Uint8Array(await f.arrayBuffer()));}

/* ════════════════════════════════════
   INIT PDF
════════════════════════════════════ */
async function initPDF(bytes){
  curBytes=bytes; deletedPages.clear(); pageShapes={};
  try{pdfJsDoc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;}
  catch(e){showModal('❌','無法讀取','此 PDF 可能已加密：'+e.message);return;}
  totalPages=pdfJsDoc.numPages;
  pageOrder=Array.from({length:totalPages},(_,i)=>i+1);
  document.getElementById('fileChip').textContent=document.getElementById('fileChip').title=fileName;
  document.getElementById('pagesChip').textContent=`共 ${totalPages} 頁`;
  document.getElementById('uploadSection').classList.add('hidden');
  document.getElementById('editorSection').classList.remove('hidden');
  buildGrid(); setMode('delete');
}

/* ════════════════════════════════════
   GRID
════════════════════════════════════ */
function buildGrid(){
  const g=document.getElementById('pagesGrid'); g.innerHTML='';
  pageOrder.forEach((p,i)=>g.appendChild(createCard(p,i+1)));
  (async()=>{for(const p of pageOrder)await renderThumb(p);})();
}
function createCard(origPage,pos){
  const c=document.createElement('div');
  c.className='pcard'; c.id='pc'+origPage; c.dataset.orig=origPage;
  c.innerHTML=`
    <div class="pthumb">
      <canvas id="cv${origPage}"></canvas>
      <div class="skel" id="sk${origPage}"><div class="spin"></div></div>
      <div class="del-ov"><div class="del-x">✕</div></div>
      <div class="sort-hdl" id="sh${origPage}"><div class="hdl-icon">⠿</div></div>
      <div class="pos-num"  id="pn${origPage}">${pos}</div>
      <div class="mk-badge hidden" id="mb${origPage}">✎ 0</div>
    </div>
    <div class="pfoot">第 ${origPage} 頁</div>`;
  c.addEventListener('click',e=>{
    if(e.target.closest('.sort-hdl'))return;
    if(mode==='delete')toggleDel(origPage,c);
    else if(mode==='markup')openEditor(origPage);
  });
  c.querySelector('.sort-hdl').addEventListener('pointerdown',e=>startDnd(e,c),{passive:false});
  return c;
}
async function renderThumb(origPage){
  const cv=document.getElementById('cv'+origPage);
  const sk=document.getElementById('sk'+origPage);
  if(!cv)return;
  const page=await pdfJsDoc.getPage(origPage);
  const w=cv.closest('.pthumb').clientWidth||108;
  const dpr=window.devicePixelRatio||1;
  const vp0=page.getViewport({scale:1});
  const vp=page.getViewport({scale:w*dpr/vp0.width});
  cv.width=vp.width; cv.height=vp.height;
  cv.style.width=w+'px'; cv.style.height=Math.round(w*vp0.height/vp0.width)+'px';
  await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
  sk?.remove();
  const shapes=pageShapes[origPage]||[];
  if(shapes.length)paintShapes(cv.getContext('2d'),shapes,cv.width,cv.height,true);
}

/* ════════════════════════════════════
   MODE
════════════════════════════════════ */
function setMode(m){
  mode=m;
  ['delete','sort','markup','conv','merge'].forEach(id=>{
    const el=document.getElementById(id==='conv'?'tab-conv':id==='merge'?'tab-merge':'tab-'+id);
    el?.classList.toggle('active',(id==='conv'&&m==='convert')||(id==='merge'&&m==='merge')||(m===id));
  });
  document.getElementById('sortHint').classList.toggle('on',m==='sort');
  document.getElementById('markHint').classList.toggle('on',m==='markup');
  document.getElementById('convPanel').classList.toggle('hidden',m!=='convert');
  document.getElementById('mergePanel').classList.toggle('hidden',m!=='merge');
  document.getElementById('pagesWrap')?.classList.toggle('hidden',m==='merge');
  document.getElementById('pagesGrid').classList.toggle('sort-mode',m==='sort');
  document.getElementById('pagesGrid').classList.toggle('mk-mode',m==='markup');
  const r=document.getElementById('toolbarR');
  if(m==='delete')r.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="invertSel()">⇄ 反選</button><button class="btn btn-ghost btn-sm" onclick="clearDel()">清除</button><button class="btn btn-ghost btn-sm" onclick="resetApp()">換檔</button>`;
  else if(m==='sort')r.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="resetOrder()">↺ 重置</button><button class="btn btn-ghost btn-sm" onclick="resetApp()">換檔</button>`;
  else if(m==='markup')r.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="clearAllMarkup()">🗑 清除全部</button><button class="btn btn-ghost btn-sm" onclick="resetApp()">換檔</button>`;
  else r.innerHTML=`<button class="btn btn-ghost btn-sm" onclick="resetApp()">換檔</button>`;
  if(m==='convert')convInitPanel();
  refreshAbar();
}

function toggleDel(p,c){deletedPages.has(p)?deletedPages.delete(p):deletedPages.add(p);c.classList.toggle('del-sel',deletedPages.has(p));refreshAbar();}
function invertSel(){pageOrder.forEach(p=>{deletedPages.has(p)?deletedPages.delete(p):deletedPages.add(p);document.getElementById('pc'+p)?.classList.toggle('del-sel',deletedPages.has(p));});refreshAbar();}
function clearDel(){deletedPages.clear();pageOrder.forEach(p=>document.getElementById('pc'+p)?.classList.remove('del-sel'));refreshAbar();}

/* ════════════════════════════════════
   SORT – DnD
════════════════════════════════════ */
function startDnd(e,card){
  if(mode!=='sort')return; e.preventDefault(); e.stopPropagation();
  const g=document.getElementById('pagesGrid'),cards=[...g.querySelectorAll('.pcard')];
  dndSrcIdx=cards.indexOf(card); dndSrcCard=card; if(dndSrcIdx<0)return;
  const r=card.getBoundingClientRect(); dndOffset={x:e.clientX-r.left,y:e.clientY-r.top};
  dndGhost=card.cloneNode(true); dndGhost.className='dnd-ghost';
  dndGhost.style.width=r.width+'px'; dndGhost.style.left=r.left+'px'; dndGhost.style.top=r.top+'px';
  dndGhost.removeAttribute('id'); dndGhost.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  document.body.appendChild(dndGhost);
  const sc=card.querySelector('canvas'),dc=dndGhost.querySelector('canvas');
  if(sc&&dc&&sc.width>0){dc.width=sc.width;dc.height=sc.height;dc.style.cssText=sc.style.cssText;dc.getContext('2d').drawImage(sc,0,0);}
  card.classList.add('dnd-src'); dndActive=true; dndDropIdx=null;
  e.target.setPointerCapture(e.pointerId);
  e.target.addEventListener('pointermove',onDndMove,{passive:false});
  e.target.addEventListener('pointerup',onDndEnd);
  e.target.addEventListener('pointercancel',onDndEnd);
}
function onDndMove(e){
  e.preventDefault(); if(!dndGhost)return;
  dndGhost.style.left=(e.clientX-dndOffset.x)+'px'; dndGhost.style.top=(e.clientY-dndOffset.y)+'px';
  dndGhost.style.visibility='hidden';
  const tgt=document.elementFromPoint(e.clientX,e.clientY)?.closest('.pcard');
  dndGhost.style.visibility='visible';
  const g=document.getElementById('pagesGrid');
  g.querySelectorAll('.pcard').forEach(c=>c.classList.remove('drop-over'));
  if(tgt&&tgt!==dndSrcCard){dndDropIdx=[...g.querySelectorAll('.pcard')].indexOf(tgt);tgt.classList.add('drop-over');}
  else dndDropIdx=null;
}
function onDndEnd(e){
  if(!dndActive)return; dndActive=false;
  e.target.removeEventListener('pointermove',onDndMove); e.target.removeEventListener('pointerup',onDndEnd); e.target.removeEventListener('pointercancel',onDndEnd);
  const g=document.getElementById('pagesGrid');
  g.querySelectorAll('.pcard').forEach(c=>c.classList.remove('dnd-src','drop-over'));
  dndGhost?.remove(); dndGhost=null;
  if(dndDropIdx!==null&&dndDropIdx!==dndSrcIdx){
    const cards=[...g.querySelectorAll('.pcard')];
    dndSrcIdx<dndDropIdx?g.insertBefore(dndSrcCard,cards[dndDropIdx].nextSibling):g.insertBefore(dndSrcCard,cards[dndDropIdx]);
    pageOrder=[...g.querySelectorAll('.pcard')].map(c=>+c.dataset.orig);
    updatePosLabels(); refreshAbar(); showToast('✅ 順序已更新');
  }
  dndSrcIdx=dndDropIdx=dndSrcCard=null;
}
function updatePosLabels(){[...document.getElementById('pagesGrid').querySelectorAll('.pcard')].forEach((c,i)=>{const b=document.getElementById('pn'+c.dataset.orig);if(b)b.textContent=i+1;});}
function resetOrder(){pageOrder=Array.from({length:totalPages},(_,i)=>i+1);const g=document.getElementById('pagesGrid');[...g.querySelectorAll('.pcard')].sort((a,b)=>+a.dataset.orig-+b.dataset.orig).forEach(c=>g.appendChild(c));updatePosLabels();refreshAbar();showToast('↺ 順序已重置');}

/* ════════════════════════════════════
   MARKUP – OPEN / CLOSE
════════════════════════════════════ */
async function openEditor(origPage){
  editingPage=origPage; zoomLevel=1.0;
  document.getElementById('editorTitle').textContent=`第 ${origPage} 頁`;
  document.getElementById('editorModal').classList.remove('hidden');

  const page=await pdfJsDoc.getPage(origPage);
  const vp0=page.getViewport({scale:1});
  const area=document.getElementById('eboxCvArea');
  const maxW=area.clientWidth-28;
  const maxH=(area.clientHeight>80?area.clientHeight:window.innerHeight*0.55)-28;
  const asp=vp0.height/vp0.width;
  editorCvW=maxW*asp<=maxH?Math.min(maxW,860):Math.round(maxH/asp);
  editorCvH=Math.round(editorCvW*asp);

  // Setup canvases at device pixel resolution
  const dpr=window.devicePixelRatio||1;
  const bgCv=document.getElementById('bgCv'),drCv=document.getElementById('drawCv');
  bgCv.width=editorCvW*dpr; bgCv.height=editorCvH*dpr;
  drCv.width=editorCvW; drCv.height=editorCvH;

  // Apply zoom=1 dimensions
  applyZoom();

  // Render PDF page into background canvas
  const bgCtx=bgCv.getContext('2d'); bgCtx.scale(dpr,dpr);
  await page.render({canvasContext:bgCtx,viewport:page.getViewport({scale:editorCvW/vp0.width})}).promise;

  updateDynTools(currentTool);
  redrawEditor(null);

  // Drawing events
  drCv.onpointerdown  = onDrawStart;
  drCv.onpointermove  = onCanvasMove;
  drCv.onpointerup    = onDrawEnd;
  drCv.onpointercancel= ()=>{isDrawing=false;redrawEditor(null);};
  drCv.onpointerleave = ()=>{if(currentTool==='text'&&!isDrawing)redrawEditor(null);};

  // Pinch-to-zoom on canvas area
  area.addEventListener('touchstart', _onPinchStart, {passive:false});
  area.addEventListener('touchmove',  _onPinchMove,  {passive:false});
  area.addEventListener('touchend',   _onPinchEnd);
  area.addEventListener('touchcancel',_onPinchEnd);

  // Ctrl+Scroll wheel zoom (desktop)
  area.addEventListener('wheel', _onWheel, {passive:false});
}

function closeEditor(){
  isDrawing=false; _pinching=false;
  if(editingPage!==null){updateMkBadge(editingPage);renderThumb(editingPage);}
  editingPage=null;
  document.getElementById('editorModal').classList.add('hidden');
  const drCv=document.getElementById('drawCv');
  drCv.onpointerdown=drCv.onpointermove=drCv.onpointerup=drCv.onpointercancel=drCv.onpointerleave=null;
  const area=document.getElementById('eboxCvArea');
  area.removeEventListener('touchstart',_onPinchStart);
  area.removeEventListener('touchmove', _onPinchMove);
  area.removeEventListener('touchend',  _onPinchEnd);
  area.removeEventListener('touchcancel',_onPinchEnd);
  area.removeEventListener('wheel',_onWheel);
  refreshAbar();
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('editorModal').classList.contains('hidden'))closeEditor();});

/* ════════════════════════════════════
   ZOOM
════════════════════════════════════ */
function doZoom(delta, preset){
  const area=document.getElementById('eboxCvArea');
  // Store viewport center in content coords before zoom
  const cx=(area.scrollLeft+area.clientWidth/2)/(editorCvW*zoomLevel);
  const cy=(area.scrollTop +area.clientHeight/2)/(editorCvH*zoomLevel);

  if(preset==='fit'){
    const fw=(area.clientWidth-28)/editorCvW, fh=(area.clientHeight-28)/editorCvH;
    zoomLevel=Math.min(fw,fh,1.0);
  } else if(preset==='1:1'){
    zoomLevel=1.0;
  } else if(preset==='2:1'){
    zoomLevel=2.0;
  } else {
    zoomLevel=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,zoomLevel+delta));
  }
  zoomLevel=Math.round(zoomLevel*20)/20; // snap to 0.05 steps
  applyZoom();

  // Scroll to maintain same center point
  requestAnimationFrame(()=>{
    area.scrollLeft=Math.max(0,cx*editorCvW*zoomLevel-area.clientWidth/2);
    area.scrollTop =Math.max(0,cy*editorCvH*zoomLevel-area.clientHeight/2);
  });
}

function applyZoom(){
  const dW=Math.round(editorCvW*zoomLevel);
  const dH=Math.round(editorCvH*zoomLevel);
  const bgCv=document.getElementById('bgCv');
  const drCv=document.getElementById('drawCv');
  const cont=document.getElementById('cvCont');
  if(bgCv){bgCv.style.width=dW+'px';bgCv.style.height=dH+'px';}
  if(drCv){drCv.style.width=dW+'px';drCv.style.height=dH+'px';}
  if(cont){cont.style.width=dW+'px';cont.style.height=dH+'px';}
  const lbl=document.getElementById('zoomLabel');
  if(lbl)lbl.textContent=Math.round(zoomLevel*100)+'%';
}

/* Ctrl+wheel zoom */
function _onWheel(e){
  if(e.ctrlKey||e.metaKey){
    e.preventDefault();
    doZoom(e.deltaY<0?0.25:-0.25);
  }
}

/* Pinch-to-zoom */
function _pinchDist(touches){return Math.hypot(touches[0].clientX-touches[1].clientX,touches[0].clientY-touches[1].clientY);}
function _onPinchStart(e){
  if(e.touches.length===2){
    _pinching=true; isDrawing=false;
    _pinchDist0=_pinchDist(e.touches); _pinchZoom0=zoomLevel;
    e.preventDefault();
  }
}
function _onPinchMove(e){
  if(_pinching&&e.touches.length===2){
    e.preventDefault();
    const d=_pinchDist(e.touches);
    zoomLevel=Math.max(ZOOM_MIN,Math.min(ZOOM_MAX,_pinchZoom0*d/_pinchDist0));
    zoomLevel=Math.round(zoomLevel*20)/20;
    applyZoom();
  }
}
function _onPinchEnd(e){if(e.touches.length<2){_pinching=false;_pinchDist0=_pinchZoom0=null;}}

/* ════════════════════════════════════
   CANVAS PAINTING
════════════════════════════════════ */
function redrawEditor(preview){
  const drCv=document.getElementById('drawCv'); if(!drCv)return;
  const ctx=drCv.getContext('2d'); ctx.clearRect(0,0,editorCvW,editorCvH);
  paintShapes(ctx,pageShapes[editingPage]||[],editorCvW,editorCvH,false);
  if(preview)paintOneShape(ctx,preview,editorCvW,editorCvH,false);
}
function paintShapes(ctx,shapes,w,h,isThumb){shapes.forEach(s=>paintOneShape(ctx,s,w,h,isThumb));}
function paintOneShape(ctx,s,w,h,isThumb){
  if(s.type==='text'){
    const fs=s.nFontSize*w;
    ctx.save();
    if(s.isPreview)ctx.globalAlpha=0.5;
    ctx.font=`${fs}px ${FONT_CSS[s.fontKey]||'sans-serif'}`;
    ctx.fillStyle=TEXT_COLOR_CSS[s.color]||'#111';
    ctx.textBaseline='top';
    ctx.fillText(s.text,s.x*w,s.y*h);
    ctx.restore();
    return;
  }
  const sC=s.strokeColor,fC=s.fillColor;
  if(sC==='transparent'&&fC==='transparent')return;
  const sStyle=sC==='red'?'#e53e3e':sC==='white'?'#fff':null;
  const fStyle=fC==='red'?'#e53e3e':fC==='white'?'#fff':null;
  const lw=isThumb?s.lineWidth*(w/600):s.lineWidth;
  ctx.save();
  ctx.lineWidth=Math.max(1,lw); ctx.lineCap=ctx.lineJoin='round';
  if(sC==='white'||fC==='white'){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=3;}
  ctx.beginPath();
  if(s.type==='rect'){ctx.rect(s.x*w,s.y*h,s.w*w,s.h*h);}
  else if(s.type==='ellipse'){
    const cx=(s.x+s.w/2)*w,cy=(s.y+s.h/2)*h,rx=Math.abs(s.w/2)*w,ry=Math.abs(s.h/2)*h;
    if(rx>.5&&ry>.5)ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
  } else if(s.type==='line'){ctx.moveTo(s.x1*w,s.y1*h);ctx.lineTo(s.x2*w,s.y2*h);}
  if(fStyle&&s.type!=='line'){ctx.fillStyle=fStyle;ctx.fill();}
  if(sStyle){ctx.strokeStyle=sStyle;ctx.stroke();}
  ctx.restore();
}

/* ════════════════════════════════════
   DRAW EVENTS
   normCoords uses getBoundingClientRect which automatically
   accounts for zoom (CSS pixel size changes with zoom).
════════════════════════════════════ */
function normCoords(e){
  const r=document.getElementById('drawCv').getBoundingClientRect();
  return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),
         y:Math.max(0,Math.min(1,(e.clientY-r.top) /r.height))};
}
function onDrawStart(e){
  if(_pinching)return;
  e.preventDefault();
  const pos=normCoords(e);
  if(currentTool==='text'){
    const text=document.getElementById('textInput')?.value.trim()||'';
    if(!text){showToast('⚠️ 請先在上方輸入文字');return;}
    (pageShapes[editingPage]||(pageShapes[editingPage]=[])).push(
      {type:'text',x:pos.x,y:pos.y,text,fontKey:currentFont,nFontSize:currentFontSize/editorCvW,color:textColor});
    redrawEditor(null); updateMkBadge(editingPage);
    return;
  }
  isDrawing=true; drawStart=pos;
  this.setPointerCapture(e.pointerId);
}
function onCanvasMove(e){
  if(isDrawing){e.preventDefault();redrawEditor(buildShape(drawStart,normCoords(e)));return;}
  if(currentTool==='text'){
    const text=document.getElementById('textInput')?.value.trim()||'';
    if(!text)return;
    const pos=normCoords(e);
    redrawEditor({type:'text',x:pos.x,y:pos.y,text,fontKey:currentFont,nFontSize:currentFontSize/editorCvW,color:textColor,isPreview:true});
  }
}
function onDrawEnd(e){
  if(!isDrawing)return; isDrawing=false; e.preventDefault();
  const end=normCoords(e),minD=0.005;
  const big=currentTool==='line'?Math.hypot(end.x-drawStart.x,end.y-drawStart.y)>minD:Math.abs(end.x-drawStart.x)>minD||Math.abs(end.y-drawStart.y)>minD;
  if(!big){redrawEditor(null);return;}
  (pageShapes[editingPage]||(pageShapes[editingPage]=[])).push(buildShape(drawStart,end));
  redrawEditor(null); updateMkBadge(editingPage);
}
function buildShape(s,e){
  if(currentTool==='line')return{type:'line',x1:s.x,y1:s.y,x2:e.x,y2:e.y,strokeColor,fillColor:'transparent',lineWidth:strokeWidth};
  return{type:currentTool,x:Math.min(s.x,e.x),y:Math.min(s.y,e.y),w:Math.abs(e.x-s.x),h:Math.abs(e.y-s.y),strokeColor,fillColor,lineWidth:strokeWidth};
}
